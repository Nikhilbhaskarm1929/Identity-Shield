name: IdentityShield CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------
  # Job 1: Test & Quality Gate (CI)
  # -------------------------------------------------------------
  test:
    name: Run Tests & Quality Checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Syntax & Lint Checks
        run: |
          ruff check . --select E9,F63,F7,F82

      - name: Execute Full Test Suite
        env:
          V3_ENABLED: "true"
          INGEST_KEYS: "test-key-1:test_super_secret_signing_key_32bytes_long!"
        run: |
          python -m pytest tests/v3/ -v --tb=short -rA 2>&1 | tee test_results.log

      - name: Report Test Results to Summary
        if: always()
        run: |
          echo "## Pytest Run Summary" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 80 test_results.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

  # -------------------------------------------------------------
  # Job 2: Build & Verify Docker Image (CI)
  # -------------------------------------------------------------
  docker-build:
    name: Build & Verify Docker Image
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Container Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: identityshield:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # Job 3: Automated Zero-Downtime Deployment (CD)
  # -------------------------------------------------------------
  deploy:
    name: Deploy to Production (Render Free Tier)
    needs: [test, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        if: env.RENDER_DEPLOY_HOOK_URL != ''
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          echo "Triggering zero-downtime deployment on Render..."
          curl -s -f -X POST "${RENDER_DEPLOY_HOOK_URL}"
          echo "Deployment trigger acknowledged by cloud provider."
