services:
  identityshield:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: identityshield
    restart: unless-stopped
    ports:
      # Primary FastAPI Web Server, UI & SSE Live Stream
      - "8000:8000"
      # Dedicated Log Ingestion Microservice (HMAC-SHA256)
      - "8001:8001"
    volumes:
      # Persistent storage mount for SQLite databases, audit logs, and log spooling
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
